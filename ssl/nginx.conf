server {
    listen 443 ssl;
    server_name app.izhao.com.cn;

    ssl_certificate     /opt/ssl/app.izhao.com.cn_nginx/app.izhao.com.cn_bundle.crt;
    ssl_certificate_key /opt/ssl/app.izhao.com.cn_nginx/app.izhao.com.cn.key;

    # 可选：增强 SSL 安全配置
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 默认主页：uni-vue
    root /opt/www/uni-vue;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /uni-react {
        return 301 /uni-react/;
    }

    location /uni-react/ {
        root /opt/www;
        index index.html;
        try_files $uri $uri/ /uni-react/index.html;
    }

    location = /tech {
        return 301 /tech/;
    }

    location /tech/ {
        root /opt/www;
        index index.html;
        try_files $uri $uri/ /tech/index.html;
    }
}

