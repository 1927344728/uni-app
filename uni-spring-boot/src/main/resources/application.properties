spring.application.name=yizhao-spring-boot
server.address=0.0.0.0
server.port=9443
server.ssl.enabled=true
server.ssl.key-store=D:/MyCode/uni-app/ssl/dev.izhao.com.cn_nginx/dev.izhao.com.cn.p12
server.ssl.key-alias=tomcat
server.ssl.key-password=123456
server.ssl.key-store-password=123456
server.ssl.key-store-type=PKCS12

server.tomcat.connection-timeout=30s

spring.datasource.url=jdbc:mysql://localhost:3306/yizhao?useSSL=true&serverTimezone=Asia/Shanghai
spring.datasource.username=lizhao
spring.datasource.password=lizh1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

security.public-paths=/api/login/**,/api/hello/**,/api/public/**,/api/test/**
security.hsts-enabled=false

spring.web.resources.add-mappings=false
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 本地密钥（讯飞 TTS、腾讯云 COS）放在 application-local.properties，勿提交。
# 复制 application-local.properties.example 为 application-local.properties 后填写。
spring.config.import=optional:classpath:application-local.properties

# 讯飞在线语音合成（密钥见 application-local.properties）
xfyun.tts.host=tts-api.xfyun.cn
xfyun.tts.base-url=wss://tts-api.xfyun.cn/v2/tts
xfyun.tts.timeout-ms=30000

# 腾讯云 COS（密钥见 application-local.properties）
tencent.cos.region=ap-shanghai
tencent.cos.bucket=yizhao-1259410276
tencent.cos.public-base-url=https://yizhao-1259410276.cos.ap-shanghai.myqcloud.com
